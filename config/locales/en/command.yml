en:
  #############################################################################
  # Developer stuff / API / error messages / misc.
  command:
    bad_array_length: "Command format arrays expect 2 elements (%{given} given)"
    invalid_type: "'%{type}' is an invalid Command argument type"
    only_one_empty: "Command cannot have more than one empty format"
    state_key_overlap: "'%{name}' is invalid as a Command argument name because it would shadow a reserved variable"
    variable_overshadow: "Command Argument '%{name}' would overshadow a default context variable"
    argument:
      bad_argument_definition: "'%{arg}' is an invalid Command argument"
      bad_array_value: "Argument Array cannot contain a %{type} (only Strings are acceptable)"
    usage:
      duplicate_name: "Command cannot have duplicate argument names (specified '%{name}' twice)"
      push_non_argument: "Command::Usage can only contain instances of Command::Argument"
    exception: "That command caused a system error, which has been logged and reported."
    operator:
      err_not_found: "That command is not available."
      err_low_level: "You aren't powerful enough to use that command."
      err_invocation: "That doesn't make sense. Here's some help:\n\n"

  global:
    ###########################################################################
    # admin
    connections:
      _brief: "Print netorking information on connected players."
    disconnect:
      _brief: "Immediately disconnect the victim from the server."
      actor: "You have kicked $being. So long, sucker!"
      err_nobody: "They're not in this realm."
      err_self: "You can't disconnect yourself."
      err_seniority: "You aren't powerful enough to disconnect $being."
      victim: "You have been unceremoniously disconnected by $being."
    force:
      _brief: "Make another being take some action... whether they like it or not."
      actor: "You force $being into action."
      err_nobody: "You don't see them here."
      err_self: "Forcing yourself? That would be too meta."
      err_seniority: "You aren't powerful enough to force $being."
      victim: "You are forced into action by $being."
    goto:
      _brief: "Transport yourself to the given room."
      actor: "You squeeze through the dimensions to appear in {W$room{x."
      arrive: "$being emerges from thin air in front of you."
      err_nowhere: "Room not found."
      err_there: "You're already there."
      leave: "$being squeezes through the dimensions and out of sight."
    iedit:
      _brief: "Enter the item editor with either a new or existing item."
      edit: "You're now editing item "
      err_nothing: "No item by that id in this zone."
    items:
      _brief: "List the Items in the given Zone (or the current Zone if unspecified)"
      err_nowhere: "Couldn't find that Zone."
      title: "Items in {m$zone{x:\n\n"
      line: "[{C$rid{x] {M$item{x"
    jobs:
      _brief: "List scheduler statistics."
      batch_size: "The schedule runs {Y%u{x jobs at a time."
      next_jobs: "\nThe next {Y%u{x jobs:"
      queue_length: "There are {Y%u{x jobs in the queue."
    reboot:
       _brief: "Save the World state, reload the server process, and restore connections."
       actor: "Hold on to your butts..."
    rooms:
      _brief: "List the Rooms in the given Zone (or the current Zone if unspecified)"
      err_nowhere: "Couldn't find that Zone."
      title: "Rooms in {m$zone{x:\n\n"
      line: "[{C$rid{x] {M$room{x"
    shutdown:
      _brief: "Close all connections, save all Zones, and terminate the server process."
      actor: "Shutting down the server."
    summon:
      _brief: "Yank a person from wherever they are to appear before you."
      actor: "You call $being to stand before you."
      arrive: "$being appeares suddenly, looking dazed."
      err_here: "$subjective is already here."
      err_nobody: "They're not in this realm."
      err_self: "You can't summon yourself."
      err_seniority: "You aren't powerful enough to summon $being."
      leave: "$being dissapears without warning."
      victim: "$being calls you to stand before $objective."
    worldsave:
      _brief: "Save all loaded Zones and connected Avatars."
      start: "Saving the World..."
      success: " success!"

    ###########################################################################
    # global
    colors:
      _brief: "Display the color map"
      title: "You can use color by typing any of the codes below.\n\
              Each code is a bracket followed by a letter:\n\n"
      bracket: "\nTo make a bracket, type two of them in a row:\n\n"
      reset: "\nTo reset to the default color, the code is '{{x':\n\n"
    commands:
      _brief: "Display a list of available commands."
      actor: "\nThe following commands are available for {y$string{x:"
    emote:
      _brief: "Perform some custom in-character action."
    help:
      _brief: "Display details and usage of a command."
      err_no_desc: "No additional information available."
      err_not_found: "No help topic for '$string'."
    look:
      _brief: "Examine your surroundings."
      exit_list: "\nExits are: {R$string{x"
      here: "$being is here."
      title: "[{C$rid{x] {W$room{x"
    map:
      _brief: "Display the layout of the current zone."
      title: "Your map of {m$zone{x:"
    quit:
      _brief: "Save your Avatar and disconnect from the server."
      actor: "Logging out. Goodbye."
    save:
      _brief: "Store up-to-date information about your Avatar on the server."
      start: "Saving your profile..."
      success: " done!"
    say:
      _brief: "Talk to others in the room. This is an in-character channel."
      actor: "You say, \"{G$string{x\""
      hear: "$being says, \"{G$string{x\""
    summary:
      _brief: "Display information about the current state of your Avatar."
      title: "Your name is $string and you are a $string."
    who:
      _brief: "Display a list of players online."
      title: "Currently online:\n\n"
    whoami:
      _brief: "Display your current profile name."
      actor: "Your name is {W$being{x"
    zones:
      _brief: "List the different zones in the Realm."
      line: "[{C$rid{x] {m$zone{x ($string rooms)"
      title: "Zones in the realm:\n\n"

  #############################################################################
  edit_item:
    exit:
      _brief: "Leave item editing mode."
      actor: "You have left item editing mode."
    level:
      _brief: "Change the level of the item."
      actor: "Item level changed to '{y$string{x'."
    name:
      _brief: "Change the name of the item."
      actor: "Item name changed to '{y$string{x'."
