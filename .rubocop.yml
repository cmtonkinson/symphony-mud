inherit_from: .rubocop_todo.yml

AllCops:
  NewCops: enable

Naming/MethodParameterName:
  AllowedNames:
    - e
    - id
    - x

Metrics/ModuleLength:
  Exclude:
    - 'commands/*'

Metrics/ClassLength:
  Exclude:
    - 'core/sequences/login_sequence.rb'

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
