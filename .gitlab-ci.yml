image: "ruby:2.7"

stages:
  - static-analysis
  - test

before_script:
  - uname -a
  - cat /etc/os-release
  - apt update && apt install -y lua5.1 liblua5.1-dev
  - ruby -v
  - gem install bundler
  - bundle install -j $(nproc)

###############################################################################
# ANALYZE
# Static analysis
###############################################################################
rubocop:
  stage: static-analysis
  tags:
    - docker
  script:
    - rubocop -P

###############################################################################
# TEST
# Logical correctness
###############################################################################
rspec:
  stage: test
  tags:
    - docker
  script:
    - rspec --format=documentation --force-color
  coverage: '/\(\d+.\d+\%\) covered/'

system-tests:
  stage: test
  tags:
    - docker
  script:
    - ulimit -Sn 50000
    - system-tests/test.rb
  artifacts:
    paths:
      - system-tests/state

