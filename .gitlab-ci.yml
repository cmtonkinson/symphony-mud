image: "ruby:2.7"

stages:
  - static-analysis
  - test

before_script:
  - uname -a
  - cat /etc/os-release
  - apt update && apt install -y lua5.1 liblua5.1-dev
  - ruby -v
  - gem install bundler
  - bundle install -j $(nproc)

###############################################################################
# ANALYZE
# Static analysis
###############################################################################
rubocop:
  stage: static-analysis
  tags:
    - docker
  script:
    - rubocop
  allow_failure: true

rubycritic:
  stage: static-analysis
  tags:
    - docker
  script:
    - OUTPUT=$(rubycritic --format=console)
    - echo "$OUTPUT"
    - echo "Searching for less-than-C students..."
    - echo $OUTPUT | grep --quiet --perl-regexp 'Rating:\s+[^ABC]'
    - if [[ $? -eq 0 ]]; then echo "Found tests with less than C grade" && exit 1; fi
  allow_failure: true

###############################################################################
# TEST
# Logical correctness
###############################################################################
rspec:
  stage: test
  tags:
    - docker
  script:
    - rspec --format=documentation --force-color
  coverage: '/\(\d+.\d+\%\) covered/'

system-tests:
  stage: test
  tags:
    - docker
  script:
    - ulimit -Sn 50000
    - system-tests/test.rb
  artifacts:
    paths:
      - system-tests/state

