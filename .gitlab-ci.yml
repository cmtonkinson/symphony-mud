image: "ruby:2.5"

stages:
  - test
  - analyze

before_script:
  - ruby -v
  - gem install bundler  --no-ri --no-rdoc
  - bundle install -j $(nproc)

###############################################################################
# TEST
# Logical correctness
###############################################################################
rspec:
  stage: test
  script:
    - rspec --format=documentation --force-color
  coverage: '/\(\d+.\d+\%\) covered/'

###############################################################################
# ANALYZE
# Static analysis
###############################################################################
rubocop:
  stage: analyze
  script:
    - rubocop
  allow_failure: true

rubycritic:
  stage: analyze
  script:
    - rubycritic --format=console
  allow_failure: true

